name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml matplotlib
      - name: Promotion-gate validator + tests
        run: |
          cd gate && python3 validate_promotion.py && python3 test_gate.py
      - name: Latency exhibit regenerates
        run: cd exhibit && python3 latency_ladder.py
